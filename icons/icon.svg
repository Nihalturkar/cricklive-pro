<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#0f2040"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#ff4444"/>
      <stop offset="100%" stop-color="#cc0000"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.4">
      <stop offset="0%" stop-color="rgba(0,230,118,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,230,118,0)"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="77" fill="url(#bg)"/>

  <!-- Glow -->
  <circle cx="256" cy="215" r="180" fill="url(#glow)"/>

  <!-- Cricket Ball -->
  <circle cx="256" cy="215" r="112" fill="url(#ball)"/>

  <!-- Seam -->
  <path d="M 220 180 Q 256 150 292 180" fill="none" stroke="#ffcc00" stroke-width="5" stroke-linecap="round"/>
  <path d="M 220 250 Q 256 280 292 250" fill="none" stroke="#ffcc00" stroke-width="5" stroke-linecap="round"/>

  <!-- Stumps -->
  <rect x="237" y="350" width="7" height="80" rx="2" fill="#ddd"/>
  <rect x="253" y="350" width="7" height="80" rx="2" fill="#ddd"/>
  <rect x="269" y="350" width="7" height="80" rx="2" fill="#ddd"/>

  <!-- Bails -->
  <rect x="234" y="345" width="45" height="6" rx="3" fill="#ffcc00"/>

  <!-- Text -->
  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="52" fill="white">CrickLive</text>

  <!-- Accent line -->
  <line x1="130" y1="485" x2="382" y2="485" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
</svg>
