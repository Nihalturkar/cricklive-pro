<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body style="background:#111;color:#fff;font-family:sans-serif;padding:40px;text-align:center">
<h2>CrickLive Pro - App Icon Generator</h2>
<p>Right-click each icon and "Save image as" to the <code>icons/</code> folder</p>
<div id="icons" style="display:flex;flex-wrap:wrap;gap:20px;justify-content:center;margin-top:30px"></div>
<script>
var sizes = [72, 96, 128, 144, 152, 192, 384, 512];

sizes.forEach(function(size) {
    var canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    var ctx = canvas.getContext('2d');

    // Background gradient
    var grad = ctx.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0, '#0a1628');
    grad.addColorStop(0.5, '#0f2040');
    grad.addColorStop(1, '#0a1628');
    ctx.fillStyle = grad;

    // Rounded rect background
    var r = size * 0.15;
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.lineTo(size - r, 0);
    ctx.quadraticCurveTo(size, 0, size, r);
    ctx.lineTo(size, size - r);
    ctx.quadraticCurveTo(size, size, size - r, size);
    ctx.lineTo(r, size);
    ctx.quadraticCurveTo(0, size, 0, size - r);
    ctx.lineTo(0, r);
    ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.closePath();
    ctx.fill();

    // Cricket ball circle
    var cx = size / 2;
    var cy = size * 0.42;
    var ballR = size * 0.22;

    // Glow
    var glow = ctx.createRadialGradient(cx, cy, ballR * 0.5, cx, cy, ballR * 1.8);
    glow.addColorStop(0, 'rgba(0, 230, 118, 0.15)');
    glow.addColorStop(1, 'rgba(0, 230, 118, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, size, size);

    // Ball
    ctx.beginPath();
    ctx.arc(cx, cy, ballR, 0, Math.PI * 2);
    var ballGrad = ctx.createRadialGradient(cx - ballR * 0.3, cy - ballR * 0.3, 0, cx, cy, ballR);
    ballGrad.addColorStop(0, '#ff4444');
    ballGrad.addColorStop(1, '#cc0000');
    ctx.fillStyle = ballGrad;
    ctx.fill();

    // Ball seam
    ctx.strokeStyle = '#ffcc00';
    ctx.lineWidth = Math.max(1, size * 0.012);
    ctx.beginPath();
    ctx.arc(cx, cy, ballR * 0.65, -0.8, 0.8);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, cy, ballR * 0.65, Math.PI - 0.8, Math.PI + 0.8);
    ctx.stroke();

    // Stump lines
    var stumpW = size * 0.015;
    var stumpH = size * 0.18;
    var stumpY = cy + ballR + size * 0.06;
    ctx.fillStyle = '#ddd';
    [-1, 0, 1].forEach(function(i) {
        ctx.fillRect(cx + i * stumpW * 3 - stumpW/2, stumpY, stumpW, stumpH);
    });
    // Bails
    ctx.fillStyle = '#ffcc00';
    ctx.fillRect(cx - stumpW * 4, stumpY - stumpW, stumpW * 8, stumpW);

    // Text "CL"
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold ' + (size * 0.16) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('CrickLive', cx, size * 0.82);

    // Accent line
    var lineGrad = ctx.createLinearGradient(size * 0.2, 0, size * 0.8, 0);
    lineGrad.addColorStop(0, '#00e676');
    lineGrad.addColorStop(0.5, '#4facfe');
    lineGrad.addColorStop(1, '#00e676');
    ctx.strokeStyle = lineGrad;
    ctx.lineWidth = Math.max(1, size * 0.008);
    ctx.beginPath();
    ctx.moveTo(size * 0.25, size * 0.9);
    ctx.lineTo(size * 0.75, size * 0.9);
    ctx.stroke();

    // Container
    var div = document.createElement('div');
    div.style.cssText = 'background:#222;padding:16px;border-radius:12px';
    div.innerHTML = '<div style="margin-bottom:8px;font-size:14px;font-weight:bold">icon-' + size + '.png</div>';

    // Convert to downloadable
    var img = document.createElement('img');
    img.src = canvas.toDataURL('image/png');
    img.style.cssText = 'border-radius:' + (size * 0.15) + 'px;display:block;margin:0 auto';
    img.width = Math.min(size, 200);
    img.height = Math.min(size, 200);
    div.appendChild(img);

    // Download link
    var link = document.createElement('a');
    link.href = canvas.toDataURL('image/png');
    link.download = 'icon-' + size + '.png';
    link.textContent = 'Download';
    link.style.cssText = 'display:inline-block;margin-top:8px;padding:6px 16px;background:#2979ff;color:#fff;border-radius:6px;font-size:12px;text-decoration:none';
    div.appendChild(link);

    document.getElementById('icons').appendChild(div);
});
</script>
</body>
</html>
